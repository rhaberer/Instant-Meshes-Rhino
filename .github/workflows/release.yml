name: Publish GitHub release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Download McNeel Yak CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://files.mcneel.com/yak/tools/0.15.1/linux-x64/yak \
            --output "$RUNNER_TEMP/yak"
          chmod +x "$RUNNER_TEMP/yak"
          printf 'YAK_TOOL=%s/yak\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build release files
        run: bash packaging/build-release.sh "$GITHUB_REF_NAME" artifacts/github-release
      - name: Publish release with files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(artifacts/github-release/*.yak artifacts/github-release/InstantMeshes.Grasshopper.gha
            artifacts/github-release/InstantMeshes-Licenses-and-Notices.txt)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false
            fi
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --notes-from-tag \
              --title "Instant Meshes for Rhino and Grasshopper ${tag#v}"
          fi
